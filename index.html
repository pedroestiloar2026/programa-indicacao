<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa de Indicação — Painel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#ffffff;--panel:#fafafa;--line:#e4e4e4;--line-strong:#d0d0d0;
    --ink:#111111;--ink-2:#4a4a4a;--ink-3:#8a8a8a;--ink-4:#adadad;
    --green:#1f8a4c;--blue:#1a56c4;--radius:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1750px;margin:0 auto;padding:32px 24px 64px}
  header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:20px;font-weight:600;letter-spacing:-.2px}
  .session-box{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2)}
  .badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
  .badge.vendedor{background:#eee;color:var(--ink-2)}
  .badge.gestora{background:#e7f0ff;color:var(--blue)}
  button{font-family:inherit;font-size:12px;cursor:pointer;background:#fff;color:var(--ink);
    border:1px solid var(--line-strong);border-radius:4px;padding:7px 14px}
  button:hover{background:#f0f0f0}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-primary:hover{background:#000}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
  .kpi{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--panel)}
  .kpi .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .kpi .v{font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.4px}
  .filters{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;background:var(--panel);padding:14px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;color:var(--ink-3)}
  input[type=text],input[type=date],input[type=email],input[type=password],select,textarea{
    font-family:inherit;font-size:12px;color:var(--ink);background:#fff;
    border:1px solid var(--line-strong);border-radius:4px;padding:7px 9px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 2px rgba(17,17,17,.07)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .count{font-size:12px;color:var(--ink-2)}
  .count b{font-weight:600;color:var(--ink)}
  .table-scroll{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:70vh}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}
  thead th{position:sticky;top:0;z-index:2;background:#f2f2f2;color:var(--ink);text-align:left;
    font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    padding:10px 12px;border-bottom:1px solid var(--line-strong);cursor:pointer;user-select:none}
  thead th.ed{background:#fbfbfb}
  thead th.ed::before{content:"✎ ";font-size:9px;color:var(--ink-4)}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;position:relative}
  tbody tr:hover{background:#e2e8ee}
  td.name{color:var(--ink);font-weight:500}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.obs{white-space:normal;min-width:220px;max-width:280px;font-size:11.5px;color:var(--ink-3)}
  tbody tr:nth-child(odd) td:not(.editable){background:#ffffff}
  tbody tr:nth-child(even) td:not(.editable){background:#eef1f5}
  td.editable{cursor:pointer;background:#eef6ff}
  td.editable:hover{background:#dfeeff}
  td.locked{cursor:not-allowed;opacity:.55}
  .bar-yes{display:inline-block;width:44px;height:8px;border-radius:99px;background:var(--green);vertical-align:middle}
  .bar-no{display:inline-block;width:44px;height:8px;border-radius:99px;background:#c0392b;vertical-align:middle}
  .upper{text-transform:uppercase}
  tbody tr.pendente-resgate{box-shadow:inset 4px 0 0 #d97706}
  .kpi.alerta{border-color:#d97706;background:#fff8ec}
  .kpi.alerta .v{color:#b45309}
  .blank{color:#c8c8c8}
  td.audit{color:var(--ink-4);font-size:11px;min-width:150px;border-left:1px solid var(--line);cursor:pointer;vertical-align:middle}
  td.audit:hover{color:var(--ink-3);text-decoration:underline}
  .cstamp{display:block;margin-top:4px;font-size:9.5px;color:var(--ink-4)}
  .pop-back{position:fixed;inset:0;z-index:55;display:none;background:rgba(17,17,17,.06)}
  .pop-back.on{display:block}
  .pop{position:fixed;z-index:60;width:300px;display:none;background:#fff;border:1px solid var(--ink);
    border-radius:var(--radius);box-shadow:0 12px 34px rgba(0,0,0,.17);padding:14px;max-height:calc(100vh - 20px);overflow:auto}
  .pop.on{display:block}
  .pop h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
  .pop .grp{margin-top:12px}
  .pop .lbl{display:block;font-size:11px;color:var(--ink-3);margin-bottom:5px}
  .pop .req{color:#a3271c}
  .pop textarea{min-height:70px;resize:vertical}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:8px 0}
  .seg button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg button.sel.yes{background:var(--green);border-color:var(--green)}
  .pop-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .err{font-size:10.5px;color:#a3271c;margin-top:5px;display:none}
  .err.on{display:block}
  .overlay{position:fixed;inset:0;background:rgba(17,17,17,.35);display:none;align-items:center;justify-content:center;padding:24px;z-index:70}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:var(--radius);border:1px solid var(--line-strong);width:100%;max-width:520px;
    max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .modal-h .mt{font-size:13px;font-weight:600}
  .modal-b{padding:14px 18px;overflow:auto}
  .modal-x{border:none;background:none;font-size:18px;color:var(--ink-3);padding:0 4px}
  .act{padding:8px 0;border-bottom:1px dashed #efefef;font-size:11.5px}
  .act:last-child{border-bottom:none}
  .act .a-when{color:var(--ink-4)}
  .act .a-who{color:var(--ink-2);font-weight:500;margin:0 6px}
  .empty{padding:40px;text-align:center;color:var(--ink-3);font-size:12px}
  .loading{padding:40px;text-align:center;color:var(--ink-3);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Programa de Indicação</h1></div>
    <div class="session-box" id="session-box"></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="filters">
    <div class="grid">
      <div class="field">
        <label for="f-busca">Busca geral</label>
        <input type="text" id="f-busca" placeholder="Nome, telefone, e-mail…" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-vendedor">Vendedor</label>
        <select id="f-vendedor"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="f-venda">Gerou venda?</label>
        <select id="f-venda"><option value="">Todos</option><option value="sim">Sim</option><option value="nao">Não</option></select>
      </div>
      <div class="field">
        <label for="f-recompensa">Recompensa liberada?</label>
        <select id="f-recompensa"><option value="">Todos</option><option value="sim">Sim</option><option value="nao">Não</option></select>
      </div>
      <div class="field">
        <label for="f-situacao">Situação do resgate</label>
        <select id="f-situacao">
          <option value="">Todas</option>
          <option value="sem_venda">Sem venda</option>
          <option value="sem_recompensa">Venda sem recompensa liberada</option>
          <option value="pendente_resgate">Recompensa liberada, aguardando resgate</option>
          <option value="resgatado">Já resgatado</option>
        </select>
      </div>
    </div>
  </section>

  <div class="bar">
    <div class="count" id="count"></div>
    <div style="display:flex;gap:8px">
      <button type="button" id="btn-saldos">💰 Saldo dos indicadores</button>
      <button type="button" id="refresh">↻ Atualizar</button>
    </div>
  </div>

  <div class="table-scroll">
    <table id="tbl">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="loading" id="loading">Carregando indicações…</div>
    <div class="empty" id="empty" style="display:none">Nenhum registro encontrado.</div>
  </div>
</div>

<div class="pop-back" id="pop-back"></div>
<div class="pop" id="pop"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-h">
      <div><div class="mt" id="modal-title">Histórico</div></div>
      <button class="modal-x" id="modal-x" type="button">×</button>
    </div>
    <div class="modal-b" id="modal-body"></div>
  </div>
</div>



<script>
/* =========================================================
   CONFIGURAÇÃO DO SUPABASE
   ========================================================= */
const SUPABASE_URL = 'https://bbmglwzlwqpeykhpishs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KyY7nG5U4UFcUeLcTMrBFg_W24S0XIL';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dt = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "";
const brl = v => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2});
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

/* =========================================================
   COLUNAS — editRole: null (bloqueado) · 'vendedor' (livre) · 'gestora' (só logada)
   ========================================================= */
const COLS = [
  {key:"data_indicacao",        label:"Data de indicação",        type:"date"},
  {key:"nome_cliente_indicado", label:"Cliente indicador",        type:"text", cls:"name upper"},
  {key:"codigo_indicador",      label:"Código do Indicador",      type:"text", editRole:"vendedor"},
  {key:"telefone",              label:"Telefone",                 type:"phone"},
  {key:"email",                 label:"E-mail",                   type:"text"},
  {key:"nome_indicacao",        label:"Nome da indicação",        type:"text", cls:"upper"},
  {key:"telefone_indicacao",    label:"Telefone da indicação",    type:"phone"},
  {key:"numero_nota_fiscal",    label:"N° Nota Fiscal",           type:"text",  editRole:"vendedor"},
  {key:"vendedor",              label:"Vendedor",                 type:"text", cls:"upper"},
  {key:"gerou_venda",           label:"Gerou venda?",             type:"bool",  editRole:"vendedor"},
  {key:"faturamento_gerado",    label:"Faturamento gerado",       type:"money", editRole:"vendedor", cls:"num"},
  {key:"recompensa_liberada",   label:"Recompensa liberada?",     type:"bool",  editRole:"gestora"},
  {key:"contato_realizado",     label:"Contato realizado?",       type:"bool",  editRole:"gestora"},
  {key:"data_resgate",          label:"Data do resgate",          type:"date",  editRole:"gestora"},
  {key:"observacao",            label:"Observação",               type:"textarea", editRole:"gestora", cls:"obs"},
  {key:"semestre",              label:"Semestre",                 type:"text",  editRole:"gestora"},
  {key:"apuracao",              label:"Apuração",                 type:"date",  editRole:"gestora"}
];
const COL = Object.fromEntries(COLS.map(c => [c.key, c]));

/* formata telefone só visualmente — o dado salvo no banco não é alterado */
function formatarTelefone(v){
  if (!v) return v;
  const d = String(v).replace(/\D/g, "");
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  if (d.length === 9)  return `${d.slice(0,5)}-${d.slice(5)}`;
  if (d.length === 8)  return `${d.slice(0,4)}-${d.slice(4)}`;
  return v; // não bate com nenhum padrão conhecido — mostra como veio, sem forçar
}

let linhas = [];
let sessao = null; // { user, papel, nome }

/* =========================================================
   SESSÃO / LOGIN
   ========================================================= */
function isGestora(){ return !!(sessao && sessao.papel === 'gestora'); }

function podeEditar(col){
  if (!col.editRole) return false;
  if (col.editRole === 'vendedor') return true;
  return isGestora();
}

async function atualizarSessionBox(){
  const box = $("session-box");
  if (isGestora()){
    box.innerHTML = `<span class="badge gestora">Gestora · ${esc(sessao.nome)}</span>
      <button type="button" id="btn-logout">Sair</button>`;
    $("btn-logout").onclick = async () => { await sb.auth.signOut(); sessao = null; await atualizarSessionBox(); render(); };
  } else {
    box.innerHTML = `<span class="badge vendedor">Acesso vendedor</span>
      <button type="button" id="btn-login">Login de gestora</button>`;
    $("btn-login").onclick = abrirLoginModal;
  }
}

async function carregarSessao(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ sessao = null; return; }
  const { data: perfil } = await sb.from('perfis').select('nome,papel').eq('id', session.user.id).single();
  sessao = perfil ? { user: session.user, papel: perfil.papel, nome: perfil.nome } : null;
}

function abrirLoginModal(){
  if ($("login-overlay")) return; // já está aberto
  const div = document.createElement("div");
  div.className = "overlay on";
  div.id = "login-overlay";
  div.innerHTML = `
    <div class="modal" style="max-width:340px">
      <div class="modal-h">
        <div class="mt">Login de gestora</div>
        <button class="modal-x" id="login-x" type="button">×</button>
      </div>
      <div class="modal-b">
        <div class="field" style="margin-bottom:10px">
          <label>E-mail</label>
          <input type="text" id="login-email" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field" style="margin-bottom:10px">
          <label>Senha</label>
          <input type="password" id="login-senha" autocomplete="new-password">
        </div>
        <div class="err" id="login-err">E-mail ou senha incorretos.</div>
        <div class="pop-actions" style="border:none;padding-top:14px">
          <button type="button" class="btn-primary" id="login-entrar">Entrar</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(div);

  $("login-x").onclick = fecharLoginModal;
  $("login-entrar").onclick = async () => {
    const email = $("login-email").value.trim();
    const senha = $("login-senha").value;
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error){ $("login-err").classList.add("on"); return; }
    fecharLoginModal();
    await carregarSessao();
    await atualizarSessionBox();
    render();
  };
}

function fecharLoginModal(){
  const el = $("login-overlay");
  if (el) el.remove(); // remove do DOM de vez — não deixa rastro pro navegador associar autofill
}

/* =========================================================
   CARREGAR DADOS
   ========================================================= */
async function carregarDados(){
  $("loading").style.display = "block";
  const { data, error } = await sb.from('indicacoes').select('*').order('data_indicacao', { ascending: false });
  $("loading").style.display = "none";
  if (error){ console.error(error); return; }
  linhas = data || [];
  popularVendedores();
  render();
}

function popularVendedores(){
  const sel = $("f-vendedor");
  const atual = sel.value;
  const nomes = [...new Set(linhas.map(d => d.vendedor).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos</option>' + nomes.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if (nomes.includes(atual)) sel.value = atual;
}

/* classifica a situação de resgate de cada indicação, usada no filtro, no KPI e no destaque visual */
function situacaoResgate(d){
  if (d.gerou_venda !== true) return "sem_venda";
  if (d.recompensa_liberada !== true) return "sem_recompensa";
  if (!d.data_resgate) return "pendente_resgate";
  return "resgatado";
}

/* =========================================================
   FILTROS
   ========================================================= */
function filtrar(){
  const busca = norm($("f-busca").value.trim());
  const vendedor = $("f-vendedor").value;
  const venda = $("f-venda").value;
  const recompensa = $("f-recompensa").value;
  const situacao = $("f-situacao").value;

  return linhas.filter(d => {
    if (busca){
      const blob = norm([d.nome_cliente_indicado,d.telefone,d.email,d.nome_indicacao,d.vendedor].join(" | "));
      if (!blob.includes(busca)) return false;
    }
    if (vendedor && d.vendedor !== vendedor) return false;
    if (venda && (venda === "sim") !== !!d.gerou_venda) return false;
    if (recompensa && (recompensa === "sim") !== !!d.recompensa_liberada) return false;
    if (situacao && situacaoResgate(d) !== situacao) return false;
    return true;
  });
}

/* =========================================================
   RENDER
   ========================================================= */
function valorHTML(d, c){
  const v = d[c.key];
  if (c.type === "bool"){
    if (v === true)  return '<span class="bar-yes" title="Sim"></span>';
    if (v === false) return '<span class="bar-no" title="Não"></span>';
    return '<span class="blank">—</span>';
  }
  if (c.type === "money") return (v || v === 0) ? brl(v) : '<span class="blank">—</span>';
  if (c.type === "date")  return v ? dt(v) : '<span class="blank">—</span>';
  if (c.type === "phone") return v ? esc(formatarTelefone(v)) : '<span class="blank">—</span>';
  return v ? esc(v) : '<span class="blank">—</span>';
}

function render(){
  $("thead-row").innerHTML =
    COLS.map(c => `<th class="${c.editRole?"ed":""}">${c.label}</th>`).join("") +
    `<th>Histórico</th>`;

  const rows = filtrar();

  $("tbody").innerHTML = rows.map(d => {
    const tds = COLS.map(c => {
      const editavel = podeEditar(c);
      const cls = [c.cls||"", editavel ? "editable" : (c.editRole ? "locked" : ""), (c.type==="bool"?"mid":"")].filter(Boolean).join(" ");
      return `<td class="${cls}" data-id="${d.id}" data-key="${c.key}">${valorHTML(d,c)}
        ${d.ultimo_editor_nome && c.editRole ? `<span class="cstamp">${esc(d.ultimo_editor_nome)}</span>` : ""}</td>`;
    }).join("");
    const trCls = situacaoResgate(d) === "pendente_resgate" ? " class=\"pendente-resgate\"" : "";
    return `<tr${trCls}>${tds}<td class="audit" data-hist="${d.id}">ver histórico</td></tr>`;
  }).join("");

  $("empty").style.display = rows.length ? "none" : "block";

  const fatTotal = rows.reduce((s,d) => s + (Number(d.faturamento_gerado)||0), 0);
  const vendas = rows.filter(d => d.gerou_venda).length;
  const recs = rows.filter(d => d.recompensa_liberada).length;
  const pendentes = rows.filter(d => situacaoResgate(d) === "pendente_resgate").length;

  $("count").innerHTML = `<b>${rows.length}</b> ${rows.length===1?"indicação":"indicações"}`;
  $("kpis").innerHTML = [
    ["Indicações", rows.length, false],
    ["Vendas geradas", vendas, false],
    ["Faturamento gerado", brl(fatTotal), false],
    ["Recompensas liberadas", recs, false],
    ["Aguardando resgate", pendentes, pendentes > 0],
    ["Taxa de conversão", (rows.length ? (vendas/rows.length*100).toFixed(1) : "0.0")+"%", false]
  ].map(([k,v,alerta]) => `<div class="kpi${alerta?" alerta":""}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

/* =========================================================
   EDIÇÃO
   ========================================================= */
const pop = $("pop"), popBack = $("pop-back");
let ctx = null;

function fecharPop(){ pop.classList.remove("on"); popBack.classList.remove("on"); pop.innerHTML=""; ctx=null; }

function abrirPop(td, d, c){
  fecharPop();
  ctx = { d, c, boolVal: null };
  let controle;
  if (c.type === "bool"){
    controle = `<div class="seg" id="p-seg"><button type="button" data-v="1">Sim</button><button type="button" data-v="0">Não</button></div>`;
  } else if (c.type === "money"){
    controle = '<input type="text" id="p-val" placeholder="0,00" inputmode="numeric">';
  } else if (c.type === "date"){
    controle = '<input type="date" id="p-val">';
  } else if (c.type === "textarea"){
    controle = '<textarea id="p-val" placeholder="Escreva…"></textarea>';
  } else {
    controle = '<input type="text" id="p-val" placeholder="Escreva…">';
  }
  pop.innerHTML = `
    <h3>${esc(c.label)}</h3>
    <div class="grp"><label class="lbl">Novo valor <span class="req">*</span></label>${controle}<div class="err" id="p-err-val"></div></div>
    <div class="grp"><label class="lbl">Seu nome <span class="req">*</span></label>
      <input type="text" id="p-nome" placeholder="Quem está editando" autocomplete="off"><div class="err" id="p-err">Informe seu nome.</div></div>
    <div class="pop-actions"><button type="button" id="p-cancel">Cancelar</button><button type="button" id="p-save" class="btn-primary">Salvar</button></div>`;
  popBack.classList.add("on"); pop.classList.add("on");

  // posiciona o popup, garantindo que ele nunca fique cortado pela borda da tela
  const r = td.getBoundingClientRect();
  const alturaPop = pop.offsetHeight;
  const larguraPop = pop.offsetWidth;

  let top = r.bottom + 6;
  if (top + alturaPop > window.innerHeight - 10){
    // não cabe embaixo — abre para cima da célula
    top = Math.max(10, r.top - alturaPop - 6);
  }
  let left = r.left;
  if (left + larguraPop > window.innerWidth - 10){
    left = window.innerWidth - larguraPop - 10;
  }
  left = Math.max(10, left);

  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

async function salvar(){
  if (!ctx) return;
  const { d, c } = ctx;
  let novo;
  if (c.type === "bool"){
    if (ctx.boolVal === null){ $("p-err-val").textContent="Escolha Sim ou Não."; $("p-err-val").classList.add("on"); return; }
    novo = ctx.boolVal;
  } else if (c.type === "money"){
    const n = parseFloat($("p-val").value.replace(/\./g,"").replace(",", "."));
    if (isNaN(n)){ $("p-err-val").textContent="Informe o valor."; $("p-err-val").classList.add("on"); return; }
    novo = n;
  } else {
    novo = $("p-val").value.trim();
    if (!novo){ $("p-err-val").textContent="Preencha este campo."; $("p-err-val").classList.add("on"); return; }
  }
  const nome = $("p-nome").value.trim();
  if (!nome){ $("p-err").classList.add("on"); return; }

  const { error } = await sb.from('indicacoes')
    .update({ [c.key]: novo, ultimo_editor_nome: nome })
    .eq('id', d.id);

  if (error){ alert('Não foi possível salvar: ' + error.message); return; }
  fecharPop();
  carregarDados();
}

pop.addEventListener("click", e => {
  if (!ctx) return;
  if (e.target.closest("#p-save")) return salvar();
  if (e.target.closest("#p-cancel")) return fecharPop();
  const b = e.target.closest("#p-seg button");
  if (b){
    ctx.boolVal = b.dataset.v === "1";
    [...b.parentNode.children].forEach(x => x.className = (x===b) ? (ctx.boolVal?"sel yes":"sel") : "");
  }
});
popBack.addEventListener("mousedown", fecharPop);

$("tbody").addEventListener("click", e => {
  const hist = e.target.closest("td.audit");
  if (hist) return abrirHistorico(+hist.dataset.hist);
  const td = e.target.closest("td.editable");
  if (!td) return;
  const d = linhas.find(x => x.id === +td.dataset.id);
  abrirPop(td, d, COL[td.dataset.key]);
});

/* =========================================================
   HISTÓRICO
   ========================================================= */
async function abrirHistorico(id){
  const d = linhas.find(x => x.id === id);
  $("modal-title").textContent = "Histórico — " + (d ? d.nome_cliente_indicado : "");
  $("modal-body").innerHTML = "Carregando…";
  $("overlay").classList.add("on");
  const { data } = await sb.from('indicacoes_historico').select('*').eq('indicacao_id', id).order('criado_em', { ascending:false });
  if (!data || !data.length){ $("modal-body").innerHTML = '<div class="empty">Nenhuma edição registrada ainda.</div>'; return; }
  $("modal-body").innerHTML = data.map(l => `
    <div class="act">
      <span class="a-when">${new Date(l.criado_em).toLocaleString("pt-BR")}</span>
      <span class="a-who">${esc(l.usuario_nome || "gestora")}</span>
      — ${esc(COL[l.campo] ? COL[l.campo].label : l.campo)}:
      ${esc(l.valor_anterior || "vazio")} → ${esc(l.valor_novo || "vazio")}
    </div>`).join("");
}
$("modal-x").onclick = () => $("overlay").classList.remove("on");

/* =========================================================
   SALDO POR INDICADOR — R$400 por venda gerada, menos o já resgatado
   ========================================================= */
const VALOR_POR_VENDA = 400;

function calcularSaldos(){
  const mapa = {};
  linhas.forEach(d => {
    const cod = (d.codigo_indicador || "").trim() || "(sem código)";
    if (!mapa[cod]) mapa[cod] = { codigo: cod, nome: d.nome_cliente_indicado, telefone: d.telefone, vendas: 0, resgatadas: 0 };
    if (d.gerou_venda === true) mapa[cod].vendas++;
    if (d.gerou_venda === true && d.data_resgate) mapa[cod].resgatadas++;
  });
  return Object.values(mapa)
    .map(x => ({ ...x, ganho: x.vendas*VALOR_POR_VENDA, resgatado: x.resgatadas*VALOR_POR_VENDA, saldo: (x.vendas-x.resgatadas)*VALOR_POR_VENDA }))
    .sort((a,b) => b.saldo - a.saldo);
}

function abrirSaldos(){
  $("modal-title").textContent = "Saldo dos indicadores";
  $("overlay").classList.add("on");
  const saldos = calcularSaldos();
  if (!saldos.length){ $("modal-body").innerHTML = '<div class="empty">Nenhum indicador com venda registrada ainda.</div>'; return; }
  $("modal-body").innerHTML = `
    <table style="width:100%;font-size:12px;border-collapse:collapse">
      <thead><tr style="text-align:left;color:var(--ink-3);font-size:10.5px;text-transform:uppercase">
        <th style="padding:6px 8px 6px 0">Código</th><th>Indicador</th><th>Vendas</th><th>Ganho</th><th>Resgatado</th><th style="text-align:right">Saldo</th>
      </tr></thead>
      <tbody>
        ${saldos.map(s => `
          <tr style="border-top:1px solid var(--line)">
            <td style="padding:7px 8px 7px 0">${esc(s.codigo)}</td>
            <td>${esc((s.nome||"").toUpperCase())}<br><span style="color:var(--ink-4);font-size:10.5px">${esc(formatarTelefone(s.telefone))}</span></td>
            <td>${s.vendas}</td>
            <td>${brl(s.ganho)}</td>
            <td>${brl(s.resgatado)}</td>
            <td style="text-align:right;font-weight:600;${s.saldo>0?"color:#b45309":""}">${brl(s.saldo)}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}
$("btn-saldos").onclick = abrirSaldos;

/* =========================================================
   EVENTOS GERAIS

["f-busca","f-vendedor","f-venda","f-recompensa","f-situacao"].forEach(id => {
